<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Portal</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7fa}
header{background:#2c3e50;color:#fff;padding:15px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
header input,header select{padding:8px;border-radius:5px;border:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;padding:20px}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,0.1);transition:.2s}
.card:hover{transform:scale(1.05)}
.card img{width:50px;height:50px}
button{background:#3498db;color:#fff;border:none;padding:8px;border-radius:5px;cursor:pointer}
button:hover{background:#2980b9}
</style>
</head>
<body>

<header>
<h1>💼 Job Portal</h1>
<input type="text" id="search" placeholder="Search jobs...">
<select id="companyFilter"><option value="all">All Companies</option></select>
<select id="roleFilter">
<option value="all">All Roles</option>
<option value="Developer">Developer</option>
<option value="Designer">Designer</option>
<option value="Manager">Manager</option>
</select>
</header>

<main>
<section>
<h2>Available Jobs</h2>
<div id="jobList" class="grid"></div>
</section>

<section>
<h2>⭐ Saved Jobs</h2>
<div id="savedJobs" class="grid"></div>
</section>
</main>

<script>
const jobs=[
{id:1,title:"Frontend Developer",company:"Google",salary:"₹10 LPA",location:"Bangalore",role:"Developer"},
{id:2,title:"UI Designer",company:"Adobe",salary:"₹8 LPA",location:"Hyderabad",role:"Designer"},
{id:3,title:"Project Manager",company:"Infosys",salary:"₹12 LPA",location:"Pune",role:"Manager"},
{id:4,title:"Backend Developer",company:"Amazon",salary:"₹11 LPA",location:"Chennai",role:"Developer"}
];

let saved=[];

const jobList=document.getElementById("jobList");
const savedJobs=document.getElementById("savedJobs");
const search=document.getElementById("search");
const companyFilter=document.getElementById("companyFilter");
const roleFilter=document.getElementById("roleFilter");

function getLogo(company){
const logos={
"Google":"https://logo.clearbit.com/google.com",
"Adobe":"https://logo.clearbit.com/adobe.com",
"Infosys":"https://logo.clearbit.com/infosys.com",
"Amazon":"https://logo.clearbit.com/amazon.com"
};
return logos[company]||"https://via.placeholder.com/50";
}

function renderJobs(data,container,isSaved=false){
container.innerHTML="";
data.forEach(job=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<img src="${getLogo(job.company)}">
<h3>${job.title}</h3>
<p><strong>${job.company}</strong></p>
<p>${job.salary}</p>
<p>${job.location}</p>
<button>${isSaved?"Remove":"Save"}</button>
`;
const btn=card.querySelector("button");
btn.onclick=()=>{
if(isSaved){
saved=saved.filter(j=>j.id!==job.id);
}else{
if(!saved.find(j=>j.id===job.id)) saved.push(job);
}
updateUI();
};
container.appendChild(card);
});
}

function updateUI(){
const searchText=search.value.toLowerCase();
const companyVal=companyFilter.value;
const roleVal=roleFilter.value;

const filtered=jobs.filter(job=>
job.title.toLowerCase().includes(searchText)&&
(companyVal==="all"||job.company===companyVal)&&
(roleVal==="all"||job.role===roleVal)
);

renderJobs(filtered,jobList);
renderJobs(saved,savedJobs,true);
}

function loadCompanies(){
const companies=[...new Set(jobs.map(j=>j.company))];
companies.forEach(c=>{
const opt=document.createElement("option");
opt.value=c;
opt.textContent=c;
companyFilter.appendChild(opt);
});
}

search.oninput=updateUI;
companyFilter.onchange=updateUI;
roleFilter.onchange=updateUI;

loadCompanies();
updateUI();
</script>

</body>
</html>
